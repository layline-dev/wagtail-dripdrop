name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install .[dev]
      - run: ruff check .
      - run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Each entry pins the Wagtail/Django pair explicitly so a resolver
        # change cannot silently narrow what is actually covered. The oldest
        # and newest supported versions of each are represented.
        include:
          - python-version: "3.10"
            wagtail: "5.2"
            django: "4.2"
          - python-version: "3.11"
            wagtail: "6.3"
            django: "4.2"
          - python-version: "3.12"
            wagtail: "6.3"
            django: "5.1"
          - python-version: "3.12"
            wagtail: "7.0"
            django: "5.1"
          - python-version: "3.12"
            wagtail: "7.4"
            django: "5.2"
          - python-version: "3.13"
            wagtail: "7.4"
            django: "5.2"
          - python-version: "3.13"
            wagtail: "7.4"
            django: "6.0"
    name: py${{ matrix.python-version }} / wagtail ${{ matrix.wagtail }} / django ${{ matrix.django }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install .[dev] "wagtail~=${{ matrix.wagtail }}.0" "django~=${{ matrix.django }}.0"
      - name: Show resolved versions
        run: python -c "import wagtail, django; print('wagtail', wagtail.__version__, '/ django', django.get_version())"
      - run: pytest
